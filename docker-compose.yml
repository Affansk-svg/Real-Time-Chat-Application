services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chat_db
    ports: ["3307:3306"]
    volumes: [chat_mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
  app:
    build: .
    depends_on: { mysql: { condition: service_healthy } }
    restart: on-failure
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/chat_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: realtime-chat-super-secret-key-change-me-0123456789
volumes:
  chat_mysql:
