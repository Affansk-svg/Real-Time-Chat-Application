server:
  port: 8080
spring:
  application:
    name: realtime-chat
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chat_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
app:
  jwt:
    secret: ${JWT_SECRET:realtime-chat-super-secret-key-change-me-0123456789}
    expiration-ms: 86400000
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{userId:-}] %logger{25} - %msg%n"
